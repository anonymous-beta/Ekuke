[package]
name = "ekuke"
version = "0.2.0"
description = "EKUKE — Local-first OSINT investigation platform"
authors = ["Anonymous-beta <chinedu>"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tantivy = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
zip = { version = "2", features = ["deflate"] }
walkdir = "2"
regex = "1"
anyhow = "1"
thiserror = "1"
dirs = "5"
# FIX: TLS enabled — without this NO https request (AI, RDAP, crt.sh…) can work
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
md-5 = "0.10"
tempfile = "3"
bincode = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]