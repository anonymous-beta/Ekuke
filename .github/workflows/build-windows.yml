name: Build EKUKE Windows Installer

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for Tauri icon generator)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate icons from source PNG
        run: npx --yes @tauri-apps/cli@latest icon src-tauri/icons/icon.png

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build EKUKE
        run: cargo tauri build --verbose
        working-directory: ./src-tauri

      - name: Upload NSIS installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: ekuke-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: ekuke-portable
          path: src-tauri/target/release/ekuke.exe
          if-no-files-found: warn
